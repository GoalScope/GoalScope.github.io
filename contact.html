<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.tailwindcss.com https://fonts.googleapis.com https://fonts.gstatic.com 'unsafe-inline'; style-src 'self' https://cdn.tailwindcss.com https://fonts.googleapis.com 'unsafe-inline'; font-src https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'">
<title>Contact — goalscope</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={darkMode:'class',theme:{extend:{fontFamily:{sans:['Inter','sans-serif']}}}}</script>
</head>
<body class="bg-[#070b1a] text-slate-100 antialiased">
<header class="sticky top-0 z-40 border-b border-white/10 bg-[#070b1a]/80 backdrop-blur-xl">
  <div class="mx-auto flex max-w-[1180px] items-center justify-between gap-6 px-5 py-3.5">
    <a href="index.html" class="flex items-center gap-2.5"><span class="grid h-9 w-9 place-items-center rounded-xl bg-gradient-to-br from-blue-600 to-cyan-400 font-black text-white">G</span><span class="text-[18px] font-black tracking-tight">goalscope</span></a>
    <nav class="hidden gap-6 text-[13px] font-semibold text-slate-400 md:flex"><a href="index.html" class="hover:text-white">Home</a><a href="predictions.html" class="hover:text-white">Predictions</a><a href="about.html" class="hover:text-white">How it works</a><a href="blog.html" class="hover:text-white">Insights</a><a href="contact.html" class="text-white">Contact</a></nav>
    <a href="predictions.html" class="rounded-full bg-blue-600 px-4 py-2 text-sm font-bold text-white">View tips</a>
  </div>
</header>
<main class="mx-auto max-w-[760px] px-5 py-10">
  <h1 class="text-3xl font-black tracking-tight">Contact</h1>
  <p class="mt-2 text-sm text-slate-400">Questions, corrections, or partnerships — we reply within 24h.</p>
  <div class="mt-6 rounded-2xl border border-white/10 bg-white/[0.03] p-6 backdrop-blur">
    <form onsubmit="event.preventDefault(); alert('Demo form — connect to Formspree (see README) or replace with your email.');" class="grid gap-4">
      <div><label class="text-xs font-bold tracking-widest text-slate-400">Name</label><input required placeholder="Your name" class="mt-1 w-full rounded-xl border border-white/10 bg-[#0a132c] px-4 py-3 text-sm outline-none focus:border-blue-500/50 placeholder:text-slate-500"></div>
      <div><label class="text-xs font-bold tracking-widest text-slate-400">Email</label><input type="email" required placeholder="you@example.com" class="mt-1 w-full rounded-xl border border-white/10 bg-[#0a132c] px-4 py-3 text-sm outline-none focus:border-blue-500/50 placeholder:text-slate-500"></div>
      <div><label class="text-xs font-bold tracking-widest text-slate-400">Message</label><textarea rows="5" required placeholder="How can we help?" class="mt-1 w-full rounded-xl border border-white/10 bg-[#0a132c] px-4 py-3 text-sm outline-none focus:border-blue-500/50 placeholder:text-slate-500"></textarea></div>
      <button type="submit" class="rounded-full bg-blue-600 px-6 py-3 text-sm font-extrabold text-white hover:bg-blue-500 transition">Send message</button>
    </form>
  </div>
  <div class="mt-4 rounded-2xl border border-white/10 bg-white/[0.03] p-5">
    <h3 class="font-bold">Other ways</h3><p class="mt-2 text-sm leading-relaxed text-slate-400">Email: tips@goalscope.example<br>X: @goalscope<br>Predictions folder: /storage/emulated/0/Predictions/<br>Site: goalscope.github.io</p>
  </div>
</main>
</body>
</html>
